# El servidor MCP de PinDesk para el Mac (`pindesk-mcp`), el de Windows
# (`apps/pindesk-mcp`) adaptado: Claude Desktop, Claude Code y cualquier
# cliente MCP lo arrancan y le hablan JSON-RPC 2.0 por stdin/stdout. Lo que
# escribe en PinDesk va por el enlace firmado `pixpinmax://pedido` (el pedido
# `herramienta`, con su fichero de respuesta); lo que lee, aqui mismo.
[package]
name = "pindesk-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pindesk-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
sha2 = "0.10.9"
pindesk-ia = { path = "../pindesk-ia" }
pindesk-proyecto = { path = "../pindesk-proyecto" }
pindesk-pdf = { path = "../pindesk-pdf" }
pindesk-docs = { path = "../pindesk-docs" }
pindesk-office = { path = "../pindesk-office" }
pindesk-hojas = { path = "../pindesk-hojas" }
